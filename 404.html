<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>h5pla | Test Screen</title>
    <script>
        // Single Page App routing fallback for static hosting without hash (#)
        var l = window.location;
        var pathSegmentsToKeep = 0;

        var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
            (l.search ? '&q=' + l.search.slice(1) : '') +
            l.hash;

        l.replace(redirectUrl);
    </script>
</head>
<body>
<p>Loading h5pla...</p>
</body>
</html>
